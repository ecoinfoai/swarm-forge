# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# The optional propagation token defaults to forward-only. Use back-one or
# back-all to queue merge-only copies to earlier windows.
# Any fields after those tokens are passed to the agent CLI, e.g. --yolo.
# Every role runs on Claude. Effort follows the operator's stage policy:
# specification, implementation, cleanup, hardening, and QA at high; the
# architecture audit at xhigh. opus specifies, audits, and verifies last.
window-invisible specifier claude master --model opus --effort high
window-invisible coder claude coder --model sonnet --effort high
window-invisible cleaner claude cleaner batch back-one --model sonnet --effort high
window-invisible architect claude architect batch back-all --model opus --effort xhigh
window-invisible hardender claude hardender batch --model sonnet --effort high
window-invisible QA claude QA batch back-all --model opus --effort high
